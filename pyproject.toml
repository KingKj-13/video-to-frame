[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-frame"
version = "0.1.0"
description = "Reduce a video to a minimal, information-preserving frame set for downstream 3D reconstruction pipelines."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# scikit-image is dev-only: the runtime SSIM implementation was replaced
# (Phase 2.5) with a validated-equivalent, faster cv2.boxFilter version, but
# tests still cross-check against skimage's reference output.
dev = ["pytest>=7.4", "scikit-image>=0.21"]

[project.scripts]
video-to-frame = "video_to_frame.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
